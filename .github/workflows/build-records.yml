name: Build historical records
on:
  push:
    branches: [mac-explorer-release]
    paths: ['.github/workflows/build-records.yml']
permissions:
  contents: write
jobs:
  records:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          python -m pipelines.generate_enterprise /tmp/mac-records --orders 50000
          python -c "from pathlib import Path; from pipelines.ingest import run; print(run(Path('/tmp/mac-records')))"
          python -m pipelines.export_records /tmp/mac-records records
          python -c "import json; assert json.load(open('records/manifest.json')) == json.load(open('expected-record-manifest.json'))"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add records
          git commit -m "Publish hash-verified historical records"
          git push origin HEAD:mac-explorer-release
