name: MAC live dedup verification
on:
  push:
    branches: [mac-visual-dedup]
    paths: [.github/workflows/visual-dedup-live.yml]
permissions:
  contents: read
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm install --no-save playwright && npx playwright install --with-deps chromium
      - name: Verify production
        env:
          MAC_BASE_URL: https://shaikarham.github.io/MAC/?v=125d3e9
        run: |
          for i in $(seq 1 30); do
            if curl -fsSL "$MAC_BASE_URL" | grep -q 'presentation.js?v=dedup1'; then break; fi
            sleep 10
          done
          curl -fsSL "$MAC_BASE_URL" | grep -q 'presentation.js?v=dedup1'
          node tests/visual-dedup.cjs
          node tests/presentation.cjs
          node tests/finance-acceptance.cjs
